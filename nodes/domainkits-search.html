<script type="text/javascript">
	(function () {
		var FIELDS = {
			nrds: ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'create_date_start', 'create_date_end', 'period_min', 'period_max', 'has_sale', 'exclude_query', 'sort', 'limit', 'offset'],
			'nrds-live': ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'create_date_start', 'create_date_end', 'exclude_query', 'sort', 'limit', 'offset'],
			expired: ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'status', 'age_min', 'age_max', 'found_date_start', 'found_date_end', 'auction_date_start', 'auction_date_end', 'has_hold', 'exclude_query', 'sort', 'limit', 'offset'],
			aged: ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'age_min', 'age_max', 'has_sale', 'exclude_query', 'sort', 'limit', 'offset'],
			active: ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'has_sale', 'exclude_query', 'sort', 'limit', 'offset'],
			deleted: ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'age_min', 'age_max', 'found_date_start', 'found_date_end', 'has_hold', 'exclude_query', 'sort', 'limit', 'offset'],
			market: ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'platform', 'listed_days_min', 'listed_days_max', 'has_sale', 'exclude_query', 'sort', 'limit', 'offset'],
		};
		var ALL = ['query', 'tld', 'position', 'length_min', 'length_max', 'composition', 'status', 'age_min', 'age_max', 'create_date_start', 'create_date_end', 'found_date_start', 'found_date_end', 'auction_date_start', 'auction_date_end', 'period_min', 'period_max', 'has_hold', 'listed_days_min', 'listed_days_max', 'platform', 'has_sale', 'exclude_query', 'sort', 'limit', 'offset'];

		RED.nodes.registerType('domainkits-search', {
			category: 'network',
			color: '#7DD3FC',
			icon: 'font-awesome/fa-globe',
			inputs: 1,
			outputs: 1,
			paletteLabel: 'domain search',
			defaults: {
				name: { value: '' },
				api: { value: '', type: 'domainkits-api', required: true },
				resource: { value: 'nrds' },
				query: { value: '' },
				tld: { value: 'com' },
				position: { value: '' },
				length_min: { value: '' },
				length_max: { value: '' },
				composition: { value: '' },
				status: { value: '' },
				age_min: { value: '' },
				age_max: { value: '' },
				create_date_start: { value: '' },
				create_date_end: { value: '' },
				found_date_start: { value: '' },
				found_date_end: { value: '' },
				auction_date_start: { value: '' },
				auction_date_end: { value: '' },
				period_min: { value: '' },
				period_max: { value: '' },
				has_hold: { value: '' },
				listed_days_min: { value: '' },
				listed_days_max: { value: '' },
				platform: { value: '' },
				has_sale: { value: false },
				exclude_query: { value: '' },
				sort: { value: '' },
				limit: { value: 15 },
				offset: { value: 0 },
			},
			label: function () {
				return this.name || 'domain search: ' + (this.resource || 'nrds');
			},
			oneditprepare: function () {
				function refresh() {
					var resource = $('#node-input-resource').val() || 'nrds';
					var visible = FIELDS[resource] || [];
					ALL.forEach(function (field) {
						$('#form-row-' + field).toggle(visible.indexOf(field) !== -1);
					});
				}
				$('#node-input-resource').on('change', refresh);
				refresh();
			},
		});
	})();
</script>

<script type="text/html" data-help-name="domainkits-search">
	<p>Searches the DomainKits domain inventories. The default resource is newly registered domains: every domain registered in the last 60 days, refreshed daily. The same node also covers the live registration feed, expired, aged, active, deleted and for-sale domains.</p>

	<h3>Inputs</h3>
	<dl class="message-properties">
		<dt class="optional">query <span class="property-type">object</span></dt>
		<dd>Overrides any configured parameter for this run, e.g. <code>{"query":"clinic","create_date_start":"2026-07-10","limit":50}</code>. Keys match the REST parameters. <code>query.resource</code> switches the resource per message.</dd>
	</dl>

	<h3>Outputs</h3>
	<dl class="message-properties">
		<dt>payload <span class="property-type">array</span></dt>
		<dd>One object per domain: <code>domain</code>, <code>tld</code>, <code>length</code> everywhere, plus the resource's own fields such as <code>created</code>, <code>expires</code>, <code>age</code>, <code>status</code>, <code>for_sale</code>, <code>platform</code>, <code>components</code>, <code>tld_count</code>.</dd>
		<dt>total <span class="property-type">number</span></dt>
		<dd>Size of the full result set. Page through it with <code>offset</code>; a single request returns at most 500 rows.</dd>
	</dl>

	<h3>Details</h3>
	<p><b>Parameter grammar.</b> Numeric ranges are min/max pairs, date ranges are start/end pairs; either side may be omitted, equal bounds select an exact value. Composition filters accept only <code>true</code>/<code>false</code>. Unknown names and values return 400 with the supported values in the message.</p>
	<p><b>Newly registered vs live feed.</b> <code>nrds</code> holds 60 days, refreshed daily. <code>nrds-live</code> holds the last 3 days with live updates, so it surfaces names registered hours ago, and also carries <code>.ai</code> and <code>.io</code>. It takes a single <code>tld</code> value and runs on a smaller per-minute quota.</p>
	<p><b>gTLDs only.</b> Country-code TLDs are not indexed: a query for <code>.de</code> or <code>.co</code> returns an empty result set, not an error. <code>nrds-live</code> is the exception and also carries <code>.ai</code> and <code>.io</code>.</p>
	<p><b>No PII.</b> Responses contain no personal data: domain name, dates, status and TLD counts only.</p>
	<p>The same key works across every DomainKits endpoint. Full parameter reference: <a href="https://domainkits.com/dev/api-docs" target="_blank">API docs</a> and <a href="https://domainkits.com/dev/openapi.yaml" target="_blank">OpenAPI spec</a>.</p>
</script>
